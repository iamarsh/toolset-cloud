name: Security Scan & Auto-Fix

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        id: audit
        run: |
          echo "Running pnpm audit..."
          pnpm audit --audit-level=moderate || echo "audit_issues=true" >> $GITHUB_OUTPUT

      - name: Apply security fixes
        id: fixes
        run: |
          echo "Applying security fixes..."
          pnpm audit fix --audit-level=moderate || true

          # Check if any changes were made
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_fixes=true" >> $GITHUB_OUTPUT
            echo "Security fixes applied successfully"
          else
            echo "has_fixes=false" >> $GITHUB_OUTPUT
            echo "No security fixes needed"
          fi

      - name: Create Pull Request
        if: steps.fixes.outputs.has_fixes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix(security): apply automated security patches'
          committer: GitHub <noreply@github.com>
          author: GitHub Actions <actions@github.com>
          branch: security-updates-${{ github.run_number }}
          delete-branch: true
          title: 'fix(security): Automated security updates'
          body: |
            ## 🔒 Automated Security Updates

            This PR contains automated security patches applied by `pnpm audit fix`.

            ### Changes
            - Security vulnerabilities have been patched
            - Dependencies updated to secure versions

            ### Review Checklist
            - [ ] Review dependency changes
            - [ ] Verify build passes
            - [ ] Check for breaking changes

            ---
            🤖 Generated by [Security Scan workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          labels: |
            security
            automated
            dependencies
          draft: false

      - name: Summary
        run: |
          echo "### Security Scan Results 🔒" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.fixes.outputs.has_fixes }}" == "true" ]]; then
            echo "✅ Security fixes applied and PR created" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No security issues found" >> $GITHUB_STEP_SUMMARY
          fi
